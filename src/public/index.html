<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #4ade80;
    --error: #f87171;
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Background glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease both;
  }
  .header h1 {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Platforms badges */
  .platforms {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
    animation: fadeDown 0.6s 0.1s ease both;
  }
  .badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* Search card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .input-wrap {
    flex: 1;
    position: relative;
  }

  .input-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    direction: ltr;
  }
  .input-wrap input::placeholder { color: var(--muted); }
  .input-wrap input:focus { border-color: var(--accent); }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  /* Result */
  .result {
    display: none;
    margin-top: 20px;
    animation: fadeUp 0.4s ease both;
  }
  .result.show { display: block; }

  /* Error */
  .error-box {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--error);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Media info */
  .media-info {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    align-items: flex-start;
  }
  .thumbnail {
    width: 100px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    flex-shrink: 0;
  }
  .thumbnail-placeholder {
    width: 100px; height: 70px;
    border-radius: 8px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.5rem;
  }
  .media-meta { flex: 1; min-width: 0; }
  .media-title {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .media-author { color: var(--muted); font-size: 0.85rem; }
  .platform-tag {
    display: inline-block;
    background: rgba(108,99,255,0.15);
    color: var(--accent);
    border-radius: 100px;
    padding: 2px 10px;
    font-size: 0.78rem;
    margin-top: 6px;
  }

  /* Formats */
  .formats-title {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .formats-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .format-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    gap: 12px;
  }
  .format-left { display: flex; align-items: center; gap: 10px; }
  .format-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .format-icon.video { background: rgba(108,99,255,0.15); }
  .format-icon.audio { background: rgba(74,222,128,0.15); }
  .format-icon.image { background: rgba(255,101,132,0.15); }
  .format-label { font-weight: 600; font-size: 0.9rem; }
  .format-quality {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .hd-badge {
    background: rgba(108,99,255,0.2);
    color: var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .dl-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: opacity 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .dl-btn:hover { opacity: 0.85; }
  .dl-btn.audio-btn { background: #4ade80; color: #0a0a0f; }
  .dl-btn.image-btn { background: var(--accent2); }

  /* Animations */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(16px);  } to { opacity: 1; transform: none; } }
  @keyframes spin     { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⬇️ Social Downloader</h1>
    <p>حمّل من أي منصة في ثواني</p>
  </div>

  <div class="platforms">
    <span class="badge">YouTube</span>
    <span class="badge">TikTok</span>
    <span class="badge">Instagram</span>
    <span class="badge">Twitter / X</span>
    <span class="badge">Facebook</span>
    <span class="badge">Reddit</span>
    <span class="badge">Vimeo</span>
    <span class="badge">SoundCloud</span>
    <span class="badge">Twitch</span>
    <span class="badge">Pinterest</span>
    <span class="badge">Snapchat</span>
    <span class="badge">Telegram</span>
    <span class="badge">Threads</span>
    <span class="badge">LinkedIn</span>
  </div>

  <div class="card">
    <div class="input-row">
      <div class="input-wrap">
        <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
      </div>
      <button class="btn" id="fetchBtn" onclick="fetchMedia()">تحميل</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>جاري جلب الروابط...</span>
    </div>

    <div class="result" id="result"></div>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  // السيرفر بتاعك — لما ترفعه على Railway غيّر السطر ده
  const API_BASE = window.location.origin;

  const urlInput  = document.getElementById('urlInput');
  const fetchBtn  = document.getElementById('fetchBtn');
  const loading   = document.getElementById('loading');
  const resultDiv = document.getElementById('result');

  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchMedia(); });

  async function fetchMedia() {
    const url = urlInput.value.trim();
    if (!url) { urlInput.focus(); return; }

    // Reset
    resultDiv.className = 'result';
    resultDiv.innerHTML = '';
    loading.className   = 'loading show';
    fetchBtn.disabled   = true;

    try {
      const res  = await fetch(`${API_BASE}/api/fetch?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      loading.className = 'loading';
      fetchBtn.disabled = false;

      if (!data.success) {
        showError(data.error || 'حدث خطأ غير متوقع');
        return;
      }

      showResult(data.data);
    } catch (err) {
      loading.className = 'loading';
      fetchBtn.disabled = false;
      showError('تعذّر الاتصال بالسيرفر. تأكد إنه شغّال.');
    }
  }

  function showError(msg) {
    resultDiv.innerHTML = `
      <div class="error-box">
        <span>⚠️</span>
        <span>${msg}</span>
      </div>`;
    resultDiv.className = 'result show';
  }

  function showResult(data) {
    const { title, author, thumbnail, platform, formats } = data;

    const thumbHtml = thumbnail
      ? `<img class="thumbnail" src="${thumbnail}" alt="thumbnail" onerror="this.style.display='none'">`
      : `<div class="thumbnail-placeholder">🎬</div>`;

    const formatsHtml = formats.map(f => {
      const isAudio = f.type === 'audio';
      const isImage = f.type === 'image';
      const icon    = isAudio ? '🎵' : isImage ? '🖼️' : '🎬';
      const btnClass = isAudio ? 'dl-btn audio-btn' : isImage ? 'dl-btn image-btn' : 'dl-btn';
      const hdBadge  = f.quality === 'HD' ? '<span class="hd-badge">HD</span>' : '';

      return `
        <div class="format-item">
          <div class="format-left">
            <div class="format-icon ${f.type}">${icon}</div>
            <div>
              <div class="format-label">${f.label} ${hdBadge}</div>
              <div class="format-quality">${f.quality}</div>
            </div>
          </div>
          <a href="${f.url}" target="_blank" rel="noopener" class="${btnClass}">فتح ↗</a>
        </div>`;
    }).join('');

    resultDiv.innerHTML = `
      <div class="media-info">
        ${thumbHtml}
        <div class="media-meta">
          <div class="media-title">${title || 'بدون عنوان'}</div>
          ${author ? `<div class="media-author">بواسطة ${author}</div>` : ''}
          <span class="platform-tag">${platform}</span>
        </div>
      </div>
      <div class="formats-title">الصيغ المتاحة (${formats.length})</div>
      <div class="formats-grid">${formatsHtml}</div>`;

    resultDiv.className = 'result show';
  }
</script>
</body>
</html>
